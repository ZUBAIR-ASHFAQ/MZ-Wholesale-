services:
  test-database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: wholesale_erp_test
      POSTGRES_USER: wholesale_erp_test
      POSTGRES_PASSWORD: wholesale_erp_test_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wholesale_erp_test -d wholesale_erp_test"]
      interval: 2s
      timeout: 3s
      retries: 20
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
